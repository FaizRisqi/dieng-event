{% extends "base.html" %}
{% block title %}Masuk{% endblock %}
{% block main_class %}max-w-md{% endblock %}

{% block content %}
<div class="bg-white rounded-2xl border border-slate-200/80 shadow-sm p-8 relative overflow-hidden">
  <!-- Brand Tricolor Accent -->
  <div class="absolute top-0 left-0 right-0 h-1.5 bg-gradient-to-r from-red-500 via-amber-400 to-emerald-500"></div>

  <div class="text-center mb-6">
    <img src="{{ url_for('static', filename='img/logo-icon.jpg') }}" alt="Logo Dieng Cyber"
         class="w-14 h-14 mx-auto rounded-xl object-contain shadow-sm border border-slate-200 mb-3">
    <h1 class="text-xl font-extrabold text-slate-900 tracking-tight">Masuk ke Akun</h1>
    <p class="text-xs text-slate-500 mt-1">Sistem Penjadwalan Event &amp; Komunitas Dieng Cyber</p>
  </div>

  <form method="post" class="space-y-4">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    
    <div>
      <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1.5">Alamat Email</label>
      <input name="email" type="email" placeholder="nama@email.com" required
             class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3.5 py-2.5 text-sm focus:bg-white focus:outline-none focus:ring-2 focus:ring-emerald-500/20 focus:border-emerald-500 transition">
    </div>

    <div>
      <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1.5">Kata Sandi</label>
      <input name="password" type="password" placeholder="••••••••" required
             class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3.5 py-2.5 text-sm focus:bg-white focus:outline-none focus:ring-2 focus:ring-emerald-500/20 focus:border-emerald-500 transition">
    </div>

    <button type="submit"
            class="w-full mt-2 bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-2.5 px-4 rounded-xl shadow-sm shadow-emerald-600/20 text-sm transition">
      Masuk Sekarang
    </button>
  </form>

  <div class="mt-6 pt-5 border-t border-slate-100 text-center text-xs text-slate-500">
    Belum memiliki akun?
    <a href="{{ url_for('auth.register') }}" class="font-bold text-emerald-600 hover:text-emerald-700 hover:underline">
      Daftar di sini
    </a>
  </div>
</div>
{% endblock %}
